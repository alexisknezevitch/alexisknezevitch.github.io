<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}"></html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });
    "></script>
</head>
<body>
    <main class="wrapper">
        <header>
            <h1>{{ .Site.Title }}</h1>
            <p class="description">{{ .Site.Params.description }}</p>
            <hr>
        </header>
        
        <article>
            {{ .Content }}
        </article>
        
        <footer>
            <hr>
            <p>&copy; {{ now.Format "2006" }} - {{ .Site.Title }}</p>
        </footer>
    </main>
</body>
</html>
